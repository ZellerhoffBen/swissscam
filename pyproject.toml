[project]
name = "swissscam"
version = "0.1.0"
description = "Local scam-call detection skeleton"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "faster-whisper",
    "numpy>=2.5.3",
    "pydantic",
    "python-multipart",
    "torch>=2.6,<3",
    "transformers>=4.45,<5",
    "uvicorn",
]


[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]
